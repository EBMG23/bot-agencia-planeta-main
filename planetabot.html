<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlanetaBot - Asistente de Reclutamiento | Agencia Planeta</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.0.0/index.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg-primary: #0a0e27;
    --bg-secondary: #131836;
    --bg-card: #1a1f45;
    --bg-input: #0f1433;
    --accent-primary: #7c3aed;
    --accent-secondary: #a855f7;
    --accent-glow: rgba(124, 58, 237, 0.3);
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border: rgba(124, 58, 237, 0.2);
    --success: #10b981;
    --warning: #f59e0b;
    --info: #3b82f6;
  }
  
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }
  
  /* Animated background */
  .bg-animation {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  
  .bg-animation .star {
    position: absolute;
    width: 2px; height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--duration) infinite;
    opacity: 0;
  }
  
  @keyframes twinkle {
    0%, 100% { opacity: 0; }
    50% { opacity: var(--opacity); }
  }
  
  .planet-bg {
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(124, 58, 237, 0.15), rgba(168, 85, 247, 0.05), transparent);
    filter: blur(60px);
    z-index: 0;
    pointer-events: none;
  }
  
  .planet-bg-2 {
    position: fixed;
    bottom: -300px; left: -200px;
    width: 700px; height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle at 70% 70%, rgba(59, 130, 246, 0.1), rgba(124, 58, 237, 0.05), transparent);
    filter: blur(80px);
    z-index: 0;
    pointer-events: none;
  }
  
  /* Layout */
  .app-container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 24px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 20px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
  }
  
  .logo {
    width: 64px; height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    animation: pulse-glow 3s ease-in-out infinite;
    overflow: hidden;
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    box-shadow: 0 0 30px var(--accent-glow);
  }
  
  .logo svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
    50% { box-shadow: 0 0 40px var(--accent-glow), 0 0 60px rgba(124, 58, 237, 0.15); }
  }
  
  .header-text h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    background: linear-gradient(135deg, #f1f5f9, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .header-text p {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  
  .status-badge {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    border-radius: 20px;
    font-size: 0.75rem;
    color: var(--success);
  }
  
  .status-dot {
    width: 8px; height: 8px;
    background: var(--success);
    border-radius: 50%;
    animation: blink 2s infinite;
  }
  
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  
  /* Chat Area */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 20px;
  }
  
  .welcome-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    text-align: center;
  }
  
  .welcome-card .icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 30px var(--accent-glow);
  }
  
  .welcome-card .icon svg {
    width: 100%;
    height: 100%;
  }
  
  .welcome-card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.3rem;
    margin-bottom: 8px;
    color: var(--text-primary);
  }
  
  .welcome-card p {
    color: var(--text-secondary);
    font-size: 0.9rem;
    line-height: 1.6;
    max-width: 500px;
    margin: 0 auto 20px;
  }
  
  .quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  
  .quick-btn {
    padding: 8px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-secondary);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }
  
  .quick-btn:hover {
    background: var(--accent-primary);
    color: white;
    border-color: var(--accent-primary);
    transform: translateY(-2px);
  }
  
  /* Messages */
  .message {
    display: flex;
    gap: 12px;
    animation: slideIn 0.3s ease;
  }
  
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .message-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  
  .message-avatar.bot {
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    box-shadow: 0 0 15px var(--accent-glow);
  }
  
  .message-avatar.bot svg {
    width: 100%;
    height: 100%;
  }
  
  .message-avatar.user {
    background: var(--bg-card);
    border: 1px solid var(--border);
    font-size: 18px;
  }
  
  .message-content {
    flex: 1;
    min-width: 0;
  }
  
  .message-bubble {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 20px;
  }
  
  .message-bubble.user-msg {
    background: var(--bg-card);
    border-color: rgba(59, 130, 246, 0.3);
  }
  
  .message-time {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 6px;
    padding-left: 4px;
  }
  
  /* Response Cards */
  .response-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    margin-top: 8px;
  }
  
  .objection-header {
    padding: 14px 20px;
    background: rgba(245, 158, 11, 0.08);
    border-bottom: 1px solid rgba(245, 158, 11, 0.2);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--warning);
    font-weight: 600;
  }
  
  .response-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }
  
  .response-section:last-child {
    border-bottom: none;
  }
  
  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent-secondary);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .response-text {
    background: var(--bg-input);
    border: 1px solid rgba(124, 58, 237, 0.1);
    border-radius: 12px;
    padding: 16px;
    font-size: 0.88rem;
    line-height: 1.7;
    color: var(--text-primary);
    white-space: pre-wrap;
    position: relative;
  }
  
  .copy-btn {
    position: absolute;
    top: 10px; right: 10px;
    padding: 6px 12px;
    background: var(--accent-primary);
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 0.72rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
  }
  
  .copy-btn:hover {
    background: var(--accent-secondary);
    transform: scale(1.05);
  }
  
  .copy-btn.copied {
    background: var(--success);
  }
  
  .tip-card {
    padding: 14px 20px;
    background: rgba(16, 185, 129, 0.06);
    border-top: 1px solid rgba(16, 185, 129, 0.2);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 0.82rem;
    color: var(--success);
    line-height: 1.5;
  }
  
  .tip-card strong {
    white-space: nowrap;
  }
  
  /* Input Area */
  .input-area {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px 20px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
    backdrop-filter: blur(10px);
  }
  
  .input-wrapper {
    flex: 1;
    position: relative;
  }
  
  .input-wrapper textarea {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    resize: none;
    outline: none;
    transition: border-color 0.2s;
    min-height: 52px;
    max-height: 120px;
    line-height: 1.5;
  }
  
  .input-wrapper textarea::placeholder {
    color: var(--text-muted);
  }
  
  .input-wrapper textarea:focus {
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  
  .send-btn {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  
  .send-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  
  .send-btn:active {
    transform: scale(0.95);
  }
  
  .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  
  /* Typing indicator */
  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 8px 0;
  }
  
  .typing-indicator span {
    width: 8px; height: 8px;
    background: var(--accent-secondary);
    border-radius: 50%;
    animation: typing 1.4s infinite;
  }
  
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
  }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }
  
  /* Responsive */
  @media (max-width: 640px) {
    .app-container { padding: 12px; }
    .header { padding: 16px; gap: 12px; border-radius: 16px; }
    .header-text h1 { font-size: 1.2rem; }
    .status-badge { display: none; }
    .welcome-card { padding: 24px 16px; }
    .response-section { padding: 16px; }
    .input-area { padding: 12px; border-radius: 16px; }
    .logo { width: 52px; height: 52px; }
    .message-avatar { width: 36px; height: 36px; }
  }
</style>
</head>
<body>

<div class="bg-animation" id="bgAnimation"></div>
<div class="planet-bg"></div>
<div class="planet-bg-2"></div>

<!-- SVG Logo Definition (reusable) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="planetGrad" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.3"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="95"/>
    </clipPath>
  </defs>
  <symbol id="planetaLogo" viewBox="0 0 200 200">
    <!-- Outer decorative border -->
    <circle cx="100" cy="100" r="98" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="3,2" opacity="0.6"/>
    <circle cx="100" cy="100" r="95" fill="url(#bgGrad)"/>
    
    <!-- Stars -->
    <g fill="#fbbf24">
      <polygon points="30,30 32,36 38,36 33,40 35,46 30,42 25,46 27,40 22,36 28,36"/>
      <polygon points="170,25 171,29 175,29 172,32 173,36 170,33 167,36 168,32 165,29 169,29" transform="scale(0.8) translate(40,10)"/>
      <polygon points="175,170 177,175 182,175 178,178 179,183 175,180 171,183 172,178 168,175 173,175" transform="scale(0.7) translate(70,70)"/>
      <polygon points="25,160 27,165 32,165 28,168 29,173 25,170 21,173 22,168 18,165 23,165" transform="scale(0.9) translate(5,20)"/>
      <circle cx="160" cy="60" r="2" fill="#fde68a"/>
      <circle cx="40" cy="70" r="1.5" fill="#fde68a"/>
      <circle cx="150" cy="150" r="2" fill="#fde68a"/>
      <circle cx="60" cy="160" r="1.5" fill="#fde68a"/>
    </g>
    
    <!-- Planet with rings -->
    <g clip-path="url(#circleClip)">
      <!-- Planet body -->
      <circle cx="100" cy="100" r="45" fill="url(#planetGrad)"/>
      <!-- Planet highlight -->
      <ellipse cx="85" cy="85" rx="20" ry="15" fill="#bae6fd" opacity="0.4"/>
      <!-- Ring behind -->
      <ellipse cx="100" cy="100" rx="65" ry="15" fill="none" stroke="url(#ringGrad)" stroke-width="4" transform="rotate(-15 100 100)"/>
      <!-- Ring front -->
      <ellipse cx="100" cy="100" rx="65" ry="15" fill="none" stroke="url(#ringGrad)" stroke-width="4" transform="rotate(-15 100 100)" opacity="0.6"/>
    </g>
    
    <!-- "Planeta" text in pink cursive -->
    <text x="100" y="95" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="42" font-weight="bold" fill="#f472b6" stroke="white" stroke-width="2" paint-order="stroke" transform="rotate(-8 100 95)">Planeta</text>
    
    <!-- Pink banner with "Planeta" in blue -->
    <rect x="55" y="115" width="90" height="22" rx="4" fill="#f472b6"/>
    <text x="100" y="132" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">Planeta</text>
    
    <!-- Decorative sparkles -->
    <g fill="#fde68a">
      <path d="M 50 50 L 52 55 L 57 55 L 53 58 L 54 63 L 50 60 L 46 63 L 47 58 L 43 55 L 48 55 Z" opacity="0.9"/>
      <path d="M 155 140 L 156 143 L 159 143 L 157 145 L 158 148 L 155 146 L 152 148 L 153 145 L 151 143 L 154 143 Z" opacity="0.9"/>
    </g>
  </symbol>
</svg>

<div class="app-container">
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 200 200"><use href="#planetaLogo"/></svg>
    </div>
    <div class="header-text">
      <h1>PlanetaBot</h1>
      <p>Asistente de Reclutamiento Elite</p>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      En línea
    </div>
  </header>
  
  <!-- Chat Area -->
  <div class="chat-area" id="chatArea">
    <div class="welcome-card" id="welcomeCard">
      <div class="icon">
        <svg viewBox="0 0 200 200"><use href="#planetaLogo"/></svg>
      </div>
      <h2>¡Bienvenido, Reclutador!</h2>
      <p>Pega aquí la objeción o duda del creador y te generaré al instante 2 opciones de respuesta listas para enviar.</p>
      <div class="quick-actions">
        <button class="quick-btn" onclick="useQuickAction('No sé si esto sea real o una estafa')">🛡️ Es estafa</button>
        <button class="quick-btn" onclick="useQuickAction('¿Me van a quitar porcentaje de mis ganancias?')">💰 Cobran porcentaje</button>
        <button class="quick-btn" onclick="useQuickAction('No tengo tiempo, tengo que trabajar')">⏰ Sin tiempo</button>
        <button class="quick-btn" onclick="useQuickAction('¿Me van a pedir mi contraseña?')">🔑 Piden contraseña</button>
        <button class="quick-btn" onclick="useQuickAction('No quiero perder el control de mi cuenta')">👤 Control de cuenta</button>
        <button class="quick-btn" onclick="useQuickAction('¿Tengo que cumplir horarios?')">📅 Horarios</button>
      </div>
    </div>
  </div>
  
  <!-- Input Area -->
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="userInput" placeholder="Pega la objeción o duda del creador aquí..." rows="1" onkeydown="handleKeydown(event)"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script>
// Generate stars
const bgAnimation = document.getElementById('bgAnimation');
for (let i = 0; i < 80; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
  star.style.setProperty('--opacity', (0.3 + Math.random() * 0.7));
  star.style.animationDelay = Math.random() * 3 + 's';
  bgAnimation.appendChild(star);
}

// Auto-resize textarea
const textarea = document.getElementById('userInput');
textarea.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function useQuickAction(text) {
  textarea.value = text;
  textarea.style.height = 'auto';
  textarea.style.height = textarea.scrollHeight + 'px';
  textarea.focus();
}

function getTime() {
  return new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}

function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  
  const welcomeCard = document.getElementById('welcomeCard');
  if (welcomeCard) welcomeCard.style.display = 'none';
  
  const chatArea = document.getElementById('chatArea');
  
  const userMsg = document.createElement('div');
  userMsg.className = 'message';
  userMsg.innerHTML = `
    <div class="message-avatar user">👤</div>
    <div class="message-content">
      <div class="message-bubble user-msg">${escapeHtml(text)}</div>
      <div class="message-time">${getTime()}</div>
    </div>
  `;
  chatArea.appendChild(userMsg);
  
  input.value = '';
  input.style.height = 'auto';
  
  const typingMsg = document.createElement('div');
  typingMsg.className = 'message';
  typingMsg.id = 'typingIndicator';
  typingMsg.innerHTML = `
    <div class="message-avatar bot"><svg viewBox="0 0 200 200"><use href="#planetaLogo"/></svg></div>
    <div class="message-content">
      <div class="message-bubble">
        <div class="typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  `;
  chatArea.appendChild(typingMsg);
  chatArea.scrollTop = chatArea.scrollHeight;
  
  setTimeout(() => {
    const typing = document.getElementById('typingIndicator');
    if (typing) typing.remove();
    
    const response = generateResponse(text);
    const botMsg = document.createElement('div');
    botMsg.className = 'message';
    botMsg.innerHTML = `
      <div class="message-avatar bot"><svg viewBox="0 0 200 200"><use href="#planetaLogo"/></svg></div>
      <div class="message-content">
        ${response}
        <div class="message-time">${getTime()}</div>
      </div>
    `;
    chatArea.appendChild(botMsg);
    chatArea.scrollTop = chatArea.scrollHeight;
  }, 1200 + Math.random() * 800);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;

function copyText(elementId, btn) {
  const element = document.getElementById(elementId);
  const clone = element.cloneNode(true);
  const copyBtn = clone.querySelector('.copy-btn');
  if (copyBtn) copyBtn.remove();
  const text = clone.textContent.trim();
  
  navigator.clipboard.writeText(text).then(() => {
    btn.innerHTML = '✅ Copiado';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = '📋 Copiar';
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    btn.innerHTML = '✅ Copiado';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = '📋 Copiar';
      btn.classList.remove('copied');
    }, 2000);
  });
}
